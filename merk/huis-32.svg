<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Interieur en Schoonmaak Lydia van der Vegt">
  <title>Interieur &amp; Schoonmaak Lydia van der Vegt</title>
  <!--
    Alleen het huisje uit het beeldmerk, opnieuw getekend op een raster van
    32 pixels. Het dak is een halve pixel breder dan de gevel zodat de rand
    niet vervaagt, en er zijn twee ruiten in plaats van vier: op dit formaat
    lopen vier ruiten aan elkaar vast tot een grijze vlek.
  -->
  <rect width="32" height="32" rx="6" fill="#0F1D26"/>
  <path d="M4 15.5 L16 5 L28 15.5 Z" fill="#2C8CA8"/>
  <path d="M7 15 h18 v11 a1 1 0 0 1 -1 1 h-16 a1 1 0 0 1 -1 -1 z" fill="#2C8CA8"/>
  <rect x="10" y="17.5" width="5" height="5" rx="0.5" fill="#0F1D26"/>
  <rect x="17" y="17.5" width="5" height="5" rx="0.5" fill="#0F1D26"/>
</svg>
