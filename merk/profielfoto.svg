<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 648" width="648" height="648" role="img" aria-label="Interieur en Schoonmaak Lydia van der Vegt">
  <title>Interieur &amp; Schoonmaak Lydia van der Vegt</title>
  <!--
    Profielfoto voor Outlook en Teams. Die wordt rond bijgesneden, dus het
    beeldmerk staat binnen een cirkel: bij deze schaal ligt zelfs de verste
    hoek van het merk (de sterren rechtsboven) nog ruim binnen de rand.
    De achtergrond vult wel het hele vierkant, want sommige weergaves in
    Outlook tonen de foto juist vierkant.
    Kleuren volgen het geborduurde logo: teal huis, witte flacon.
  -->
  <defs>
    <radialGradient id="gloed" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#1D4256"/>
      <stop offset="100%" stop-color="#0F1D26"/>
    </radialGradient>
  </defs>

  <rect width="648" height="648" fill="url(#gloed)"/>

  <svg x="109" y="136" width="430" height="373" viewBox="0 0 120 104">
